name: Collect FJ headlines

# One long-running job polls the feed every few seconds. GitHub's cron is
# unreliable (runs minutes-to-hours apart), so cron here is only a
# "keep-alive": a new run queues behind the current one (concurrency) and
# starts the moment it finishes, so polling is effectively continuous.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Live collector (polls every 10s for ~340 min)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          LIVE_COMMIT: "1"
          LIVE_INTERVAL: "10"
          LIVE_DURATION_SEC: "20400"
        run: python live.py
